<!DOCTYPE html>
<html>
    <head>
        <title>CSV Result Analyzer</title>
    </head>
    <body>
        <h1>CSV Student Result Analyzer </h1>
        <p>Upload your CSV file to analyze student result</p>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept=".csv">
            <button type="submit">Analyze CSV</button>
        
        </form>
    </body>
</html>
